<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var THEME_KEY = 'settings_theme_mode';
        var DARK_BG = '#151522';
        var LIGHT_BG = '#F8F9FE';
        var mode = 'system';
        try {
          mode = localStorage.getItem(THEME_KEY) || 'system';
        } catch (error) {
          // ignore
        }
        var prefersDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = mode === 'dark' || (mode !== 'light' && prefersDark);
        var bg = isDark ? DARK_BG : LIGHT_BG;
        var html = document.documentElement;
        html.style.backgroundColor = bg;
        html.style.setProperty('--app-page-bg', bg);
        html.classList.add(isDark ? 'theme-dark-root' : 'theme-light-root');
        document.addEventListener('DOMContentLoaded', function () {
          document.body.style.backgroundColor = bg;
        });
      })();
    </script>
    <script>
      var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') ||
        CSS.supports('top: constant(a)'))
      document.write(
        '<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
        (coverSupport ? ', viewport-fit=cover' : '') + '" />')
    </script>
    <title></title>
    <!--preload-links-->
    <!--app-context-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
